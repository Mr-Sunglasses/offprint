services:
  app:
    build:
      context: .
    image: bpc-fetch-web:local
    ports:
      - "8000:8000"
    environment:
      # talk to the browser container over CDP instead of launching Chromium
      BPC_CDP_URL: http://browser:9222
      BPC_SITES_AUTOUPDATE: "1"
      BPC_SITES_JS: /data/sites.js
      BPC_DB_PATH: /data/articles.db
      BPC_MAX_CONCURRENT: "4"
      BPC_BROWSER_CONTEXTS: "3"
    volumes:
      - bpc-data:/data
    depends_on:
      browser:
        condition: service_started
    restart: unless-stopped

  browser:
    image: bpc-fetch-web:local
    entrypoint: ["/usr/local/bin/start-browser.sh"]
    shm_size: "1gb"
    environment:
      BPC_CDP_PORT: "9222"
    # The image's healthcheck probes the app's :8000, which this container never
    # serves — override it with a real check of the CDP proxy.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket,sys; s=socket.socket(); s.settimeout(3); sys.exit(0 if s.connect_ex(('127.0.0.1',9222))==0 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  bpc-data:
