[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bpc-web"
version = "0.1.0"
description = "Web front end for bpc-fetch: read paywalled articles as clean Markdown"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "bpc-web contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "markdownify>=0.14",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "playwright>=1.40",
    "markdown>=3.7",
    "pillow>=11.0",
    "pydantic>=2.7",
]

[project.scripts]
bpc-web = "bpc_web.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bpc_web"]

[tool.hatch.build.targets.sdist]
include = ["src/bpc_web", "README.md", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Scraping arbitrary websites means arbitrary exceptions: a broken page must
# fail that one attempt, never the request. Broad excepts are the point here.
# RUF001: typographic apostrophes are deliberate in matching prose.
# SIM105: try/except/pass reads better than contextlib.suppress in the page JS glue.
ignore = ["E501", "RUF001", "SIM105"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
